<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 402" width="960" height="402" role="img" aria-labelledby="languages-dark-t" aria-describedby="languages-dark-d"><title id="languages-dark-t">Language mix</title><desc id="languages-dark-d">Language mix across the mapped public repositories, each repository weighted equally: TypeScript 31%; Python 22%; C 6%; Zig 5%; Starlark 4%; Shell 4%; Chapel 3%; R 3%; Other 22%.</desc><style>text{font-family:'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#d8dbd4}.t-title{font-size:20px;font-weight:700;fill:#c3aa84}.t-sub{font-size:13px;fill:#97a489}.t-cap{font-size:11.5px;fill:#97a489;font-style:italic;font-family:'Crimson Pro', Georgia, 'Times New Roman', serif}.t-lab{font-size:12px;fill:#d8dbd4}.t-small{font-size:11px;fill:#97a489}.t-hd{font-size:11px;font-weight:700;letter-spacing:.06em;fill:#97a489}.t-mono{font-family:'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;fill:#97a489}.bar{transform-box:fill-box;transform-origin:0 50%;animation:grow 800ms cubic-bezier(.2,.8,.2,1) backwards}@keyframes grow{from{transform:scaleX(0)}}.fade{animation:fade 500ms ease-out backwards}@keyframes fade{from{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}</style><rect x=".5" y=".5" width="959" height="401" fill="#1d2218" stroke="#3d4635"/><text x="24" y="38" class="t-title">Language mix</text>
<text x="24" y="60" class="t-sub">Share of code by language across the mapped repositories, each repository weighted equally.</text>
<text x="158" y="103" class="t-lab" text-anchor="end">TypeScript</text>
<rect class="bar" x="170" y="93" width="690" height="14" fill="#c3aa84" style="animation-delay:150ms"/>
<text x="868" y="104" class="t-mono fade" style="animation-delay:650ms">31%</text>
<text x="158" y="133" class="t-lab" text-anchor="end">Python</text>
